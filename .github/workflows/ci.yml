name: Verify

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fight_hub
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fight_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fight_hub -d fight_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable local database; never connect CI tests to production.
      DATABASE_URL: postgresql://fight_hub:ci_only_password@localhost:5432/fight_hub_test
      TEST_DATABASE_URL: postgresql://fight_hub:ci_only_password@localhost:5432/fight_hub_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Format-valid dummy key for the build. CI never calls Clerk or Stripe.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
